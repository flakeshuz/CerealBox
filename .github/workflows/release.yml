name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller cryptography

      - name: Build source archive
        if: runner.os == 'Linux'
        run: |
          git archive \
            --format=zip \
            --prefix="CerealBox-${GITHUB_REF_NAME}/" \
            --output="CerealBox-${GITHUB_REF_NAME}.zip" \
            "$GITHUB_SHA"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name CerealBox main.py
          Compress-Archive -Path dist/CerealBox -DestinationPath "CerealBox-${{ github.ref_name }}-Windows.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CerealBox-${{ github.ref_name }}*.zip
          generate_release_notes: true
