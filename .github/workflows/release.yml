name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package source
        run: |
          git archive \
            --format=zip \
            --prefix="CerealBox-${GITHUB_REF_NAME}/" \
            --output="CerealBox-${GITHUB_REF_NAME}.zip" \
            "$GITHUB_SHA"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: CerealBox-${{ github.ref_name }}.zip
          generate_release_notes: true
